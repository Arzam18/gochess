name: Build GoChess Android ARM64

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: GoChess Android ARM64 (NEON)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gochess-main

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.5'
          cache-dependency-path: gochess-main/go.sum

      - name: Run GoChess tests on host
        run: go test ./...

      - name: Set up Android NDK
        id: setup-ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r27c
          add-to-path: false

      - name: Cross-compile Android ARM64 executable
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          set -euo pipefail
          NDK_BIN="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"
          test -x "$NDK_BIN/aarch64-linux-android24-clang"

          export GOOS=android
          export GOARCH=arm64
          export GOARM64=v8.0
          export CGO_ENABLED=1
          export CC="$NDK_BIN/aarch64-linux-android24-clang"
          export CGO_CFLAGS='-O3 -fPIC -march=armv8-a'

          mkdir -p dist
          go build -trimpath -ldflags='-s -w' -o dist/gochess ./cmd/chess

          "$NDK_BIN/llvm-readelf" -h dist/gochess > dist/elf-header.txt
          grep -q 'AArch64' dist/elf-header.txt
          "$NDK_BIN/llvm-objdump" -d dist/gochess > dist/gochess-disassembly.txt
          if ! grep -Eiq '\b(smax|smin|smlal|sadalp|sqxtun)\b' dist/gochess-disassembly.txt; then
            echo 'Expected ARM64 NEON instructions were not found in the binary.' >&2
            exit 1
          fi

          cp net.txt book.bin dist/
          NET_URL="$(tr -d '\r\n' < net.txt)"
          NET_NAME="${NET_URL##*/}"
          test -n "$NET_NAME"
          curl --fail --location --retry 3 "$NET_URL" --output "dist/$NET_NAME"
          test -s "dist/$NET_NAME"
          cp ANDROID-ARM64.md dist/README.txt

          {
            echo 'Engine: GoChess'
            echo 'Target: Android ARM64 / AArch64'
            echo 'Minimum API: 24'
            echo 'Go architecture target: arm64 v8.0'
            echo 'NNUE integer backend: baseline ARM64 NEON assembly'
            echo 'DotProd: not required / not emitted by this backend'
            echo 'Syzygy: included (CGO enabled; Fathom compiled with Android NDK)'
            echo "Go: $(go version)"
            echo 'NEON disassembly check: passed'
          } > dist/build-report.txt

          rm -f dist/elf-header.txt dist/gochess-disassembly.txt
          (cd dist && zip -9 -q ../GoChess-Android-ARM64.zip gochess net.txt "$NET_NAME" book.bin README.txt build-report.txt)

      - name: Upload GoChess Android ARM64 package
        uses: actions/upload-artifact@v4
        with:
          name: GoChess-Android-ARM64
          path: gochess-main/GoChess-Android-ARM64.zip
          if-no-files-found: error
          retention-days: 30
