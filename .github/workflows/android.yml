name: Build GoChess Android ARM64

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: GoChess Android ARM64 (${{ matrix.variant }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: NEON
            goarm64: v8.0
            build_tags: gochess_embed_net
            cgo_march: armv8-a
          - variant: DotProd
            goarm64: v8.2
            build_tags: gochess_dotprod,gochess_embed_net
            cgo_march: armv8.2-a+dotprod

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Download and verify the official production NNUE
        id: production-nnue
        env:
          EXPECTED_NNUE_URL: https://github.com/adamtwiss/gochess/releases/download/v0.5.0/net-v5-120sb-sb120.nnue
          NNUE_SHA256: be22a20bfde78d7915cc0cc5fe84e917a76d5df130b9555884a570a04b3ab2fc
          NNUE_MD5: 4a58e81ac236f4f63e7ffecc7c0a2ddc
        run: |
          set -euo pipefail
          NNUE_URL="$(tr -d '\r\n' < net.txt)"
          if [[ "$NNUE_URL" != "$EXPECTED_NNUE_URL" ]]; then
            echo "net.txt changed to an unverified network URL: $NNUE_URL" >&2
            echo 'Update the expected URL and both checksums before building.' >&2
            exit 1
          fi
          mkdir -p assets
          NNUE_FILENAME="${NNUE_URL##*/}"
          NNUE_FILE="assets/$NNUE_FILENAME"
          curl --fail --location --retry 5 --retry-all-errors --retry-delay 2 "$NNUE_URL" --output "$NNUE_FILE"
          SIZE="$(stat -c '%s' "$NNUE_FILE")"
          if [[ "$SIZE" -lt 20000000 ]]; then
            echo "Downloaded NNUE is unexpectedly small: $SIZE bytes" >&2
            exit 1
          fi
          printf '%s  %s\n' "$NNUE_SHA256" "$NNUE_FILE" | sha256sum --check --strict
          printf '%s  %s\n' "$NNUE_MD5" "$NNUE_FILE" | md5sum --check --strict
          echo "Verified official production NNUE: $SIZE bytes"
          echo "size=$SIZE" >> "$GITHUB_OUTPUT"

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.5'
          cache-dependency-path: go.sum

      - name: Run GoChess tests and embedded-NNUE UCI smoke test on host
        if: matrix.variant == 'NEON'
        run: |
          set -euo pipefail
          go test ./...
          go test -tags gochess_embed_net ./...

          # Build a host test executable with the same embedded production net.
          HOST_ENGINE="$RUNNER_TEMP/gochess-uci-smoke"
          UCI_DIR="$RUNNER_TEMP/gochess-uci-isolated"
          mkdir -p "$UCI_DIR"
          go build -tags gochess_embed_net -trimpath -o "$HOST_ENGINE" ./cmd/chess
          (
            cd "$UCI_DIR"
            printf 'uci\nisready\nquit\n' | "$HOST_ENGINE" > "$RUNNER_TEMP/gochess-uci-output.txt" 2> "$RUNNER_TEMP/gochess-uci-stderr.txt"
          )
          UCI_OUTPUT="$RUNNER_TEMP/gochess-uci-output.txt"
          FIRST_LINE="$(sed -n '1p' "$UCI_OUTPUT")"
          grep -Fxq 'id name GoChess' "$UCI_OUTPUT"
          grep -Fxq 'uciok' "$UCI_OUTPUT"
          grep -Fxq 'readyok' "$UCI_OUTPUT"
          test "$FIRST_LINE" = 'id name GoChess'
          grep -Fq 'NNUE v5 loaded from embedded:net-v5-120sb-sb120.nnue' "$RUNNER_TEMP/gochess-uci-stderr.txt"
          echo 'UCI smoke test passed: embedded NNUE loaded and UCI handshake completed.'

      - name: Set up Android NDK
        id: setup-ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r27c
          add-to-path: false

      - name: Cross-compile and verify Android ARM64
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
          GOARM64_TARGET: ${{ matrix.goarm64 }}
          GO_BUILD_TAGS: ${{ matrix.build_tags }}
          CGO_MARCH: ${{ matrix.cgo_march }}
          BUILD_VARIANT: ${{ matrix.variant }}
          NNUE_SIZE: ${{ steps.production-nnue.outputs.size }}
        run: |
          set -euo pipefail
          NDK_BIN="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"
          test -x "$NDK_BIN/aarch64-linux-android24-clang"

          export GOOS=android
          export GOARCH=arm64
          export GOARM64="$GOARM64_TARGET"
          export CGO_ENABLED=1
          export CC="$NDK_BIN/aarch64-linux-android24-clang"
          export CGO_CFLAGS="-O3 -fPIC -march=$CGO_MARCH"

          rm -rf dist
          mkdir -p dist
          if [[ -n "$GO_BUILD_TAGS" ]]; then
            go build -tags "$GO_BUILD_TAGS" -trimpath -ldflags='-s -w' -o dist/gochess ./cmd/chess
          else
            go build -trimpath -ldflags='-s -w' -o dist/gochess ./cmd/chess
          fi
          chmod 755 dist/gochess
          BINARY_SIZE="$(stat -c '%s' dist/gochess)"
          if [[ "$BINARY_SIZE" -le "$NNUE_SIZE" ]]; then
            echo "Android executable ($BINARY_SIZE bytes) does not appear to contain the $NNUE_SIZE-byte embedded NNUE." >&2
            exit 1
          fi
          echo "Embedded NNUE size check passed: executable=$BINARY_SIZE bytes, network=$NNUE_SIZE bytes."

          # Keep verification files outside dist so the downloadable artifact
          # contains exactly one file: the engine executable.
          "$NDK_BIN/llvm-readelf" -h dist/gochess > "$RUNNER_TEMP/elf-header-$BUILD_VARIANT.txt"
          grep -q 'AArch64' "$RUNNER_TEMP/elf-header-$BUILD_VARIANT.txt"
          "$NDK_BIN/llvm-readelf" -l dist/gochess > "$RUNNER_TEMP/elf-program-headers-$BUILD_VARIANT.txt"
          grep -q '/system/bin/linker64' "$RUNNER_TEMP/elf-program-headers-$BUILD_VARIANT.txt"
          "$NDK_BIN/llvm-objdump" -d dist/gochess > "$RUNNER_TEMP/gochess-$BUILD_VARIANT-disassembly.txt"

          if ! grep -Eiq '\b(smax|smin|smlal|sadalp|sqxtun)\b' "$RUNNER_TEMP/gochess-$BUILD_VARIANT-disassembly.txt"; then
            echo 'Expected baseline ARM64 NEON instructions were not found.' >&2
            exit 1
          fi

          if [[ "$BUILD_VARIANT" == 'DotProd' ]]; then
            if ! grep -Eiq '[[:space:]]sdot[[:space:]]' "$RUNNER_TEMP/gochess-$BUILD_VARIANT-disassembly.txt"; then
              echo 'DotProd build requested, but no SDOT instruction was found in the executable.' >&2
              exit 1
            fi
            echo "DotProd verified: $(grep -Eic '[[:space:]]sdot[[:space:]]' "$RUNNER_TEMP/gochess-$BUILD_VARIANT-disassembly.txt") SDOT instruction(s) present."

            # Build a device-runnable differential test outside dist. This is
            # for validation only and must never be included with the engine.
            go test -c -tags gochess_dotprod,gochess_embed_net -trimpath -o "$RUNNER_TEMP/gochess-dotprod-kernel-tests" .
          else
            if grep -Eiq '[[:space:]]sdot[[:space:]]' "$RUNNER_TEMP/gochess-$BUILD_VARIANT-disassembly.txt"; then
              echo 'Unexpected SDOT instruction found in baseline NEON build.' >&2
              exit 1
            fi
            echo 'Baseline NEON verified: no SDOT instructions found.'
          fi

          test -f dist/gochess
          test "$(find dist -maxdepth 1 -type f | wc -l)" -eq 1
          echo 'Engine-only artifact check passed: dist contains exactly gochess.'

      - name: Upload engine-only artifact
        uses: actions/upload-artifact@v4
        with:
          name: GoChess-Android-ARM64-${{ matrix.variant }}
          path: dist/gochess
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
